<text x="114" y="351" font-size="16" style="fill:#172b3c;font-weight:400">Flat NTC attachment</text>
<text x="108" y="376" font-size="13" style="fill:#172b3c;font-weight:400">Active sensing area: confirm</text>
<path d="M82 158H354.0" class="dim"/>
<text x="165" y="148" font-size="16" style="fill:#172b3c;font-weight:400">32 mm MAX</text>
