<text x="49" y="645" font-size="14" font-weight="400">Dimensions describe the ambient prototype. Verify manufacturing limits and thermal expansion before ordering.</text>
<text x="49" y="668" font-size="14" font-weight="400">The PCB remains captive within assigned bounds; shock, vibration, stiffness, wear and anti-rattle behavior need testing.</text>
<text x="49" y="691" font-size="14" font-weight="400">Cable checks sample endpoint movement. They do not prove every continuous deformation or physical flex life.</text>
<text x="49" y="714" font-size="14" font-weight="400">The pack is still an unapproved supplier request. Pack retention, harness/dock and firmware remain unfinished.</text>
<text x="49" y="737" font-size="14" font-weight="400">No supplier message, order or physical water/dust qualification is implied by this drawing.</text>
