<text x="510" y="568" font-size="13" font-weight="400">Insert SIM with power off and the board seated in the lifted carrier.</text>
<text x="510" y="590" font-size="13" font-weight="400">Fit the keys, inspect tabs/cables and reject any interference.</text>
<rect x="36" y="620" width="1051" height="136" fill="#f3f6f8" stroke="none" rx="5"/>
<text x="49" y="645" font-size="14" font-weight="400">Thermal screen: -10 to +45 C, independent part temperatures and assigned CTE/tolerance bounds; not material guarantees.</text>
<text x="49" y="668" font-size="14" font-weight="400">Four radial slots allow expansion; assigned motion remains subject to tilt, load, stiffness, wear and physical testing.</text>
<text x="49" y="691" font-size="14" font-weight="400">Cable samples vary initial plug azimuth. Connector force/orientation, continuous movement and flex life are unqualified.</text>
<text x="49" y="714" font-size="14" font-weight="400">Contact stem is 7.50mm for the wider cavity; seal land unchanged. Pack/harness/dock and firmware remain unfinished.</text>
<text x="49" y="737" font-size="14" font-weight="400">No supplier message, order or physical water/dust qualification is implied by this drawing.</text>
